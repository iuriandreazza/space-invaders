name: CI and deploy

# Every pull request is verified. A push to main also builds the image and, once deploying is switched on (see
# docs/deploy.md), publishes it on the ZeroServer Community Cloud. Pull requests, forks included, never see a secret.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer run of the same pull request makes the older one pointless; a run on main is never cancelled halfway,
# as that could leave a deploy half done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Type-checks the three projects, bundles the client and compiles the server.
      - run: pnpm build
      - run: pnpm audit --audit-level high

  container:
    name: Build the image and run it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: space-invaders:ci
          # The analytics id is compiled into the client, so it has to be there at build time (see docs/deploy.md).
          build-args: |
            REVISION=${{ github.sha }}
            VITE_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
          cache-from: type=gha
      # What the platform will do with the image: run it with a fresh volume on /data and talk to it. The hardening
      # flags are the ones the README recommends, so that they are known to work.
      - name: Run the image with a fresh volume and use it
        run: |
          docker run --detach --name app --publish 8080:8080 --volume space-invaders-data:/data \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges space-invaders:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://localhost:8080/api/health
          # The commit given to the build comes out of the health check: it is how a deploy proves what runs.
          test "$(curl --fail --silent http://localhost:8080/api/health | jq -r .revision)" = "$GITHUB_SHA"
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          # Starting a session writes to the database on the volume.
          curl --fail --silent --show-error --request POST http://localhost:8080/api/sessions
          docker exec app node dist-server/server/cli.js list
          docker exec app ls -l /data
          test "$(docker exec app id -u)" != 0
      - name: Show the log of the container
        if: always()
        run: docker logs app || true

  image:
    name: Build and publish the image
    needs: [verify, container]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # The community nodes are a mix of amd64 and arm64 machines, and an app can be placed on or moved to either,
      # so the image has to run on both.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Attestations would add extra entries to the manifest list; the platform wants one manifest per image.
          provenance: false
          sbom: false
          # The health check reports it, which is how the deploy job knows that the new version is the one answering.
          build-args: |
            REVISION=${{ github.sha }}
            VITE_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Space Invaders, a browser tribute with a global leaderboard
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the ZeroServer Community Cloud
    needs: image
    # Switched on with the repository variable DEPLOY_ENABLED=true, once the ZS_API_KEY secret exists.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ZS_VERSION: v0.14.0
      # SHA-256 of the zs-linux-x64 asset of that release, checked before the binary is run.
      ZS_SHA256: fd8831af208e181a0ce3964109fd59cd19c03237f3c6b8ab9c42ca0f98ba09a0
      ZS_EXPECTED_USER: iuriandreazza
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the zs CLI at a pinned version and checksum
        run: |
          curl --fail --silent --show-error --location --output zs \
            "https://github.com/zeroserver-cc/zsc-cli/releases/download/${ZS_VERSION}/zs-linux-x64"
          echo "${ZS_SHA256}  zs" | sha256sum --check --strict
          sudo install -m 0755 zs /usr/local/bin/zs
          zs --version
      - name: Log in with the API key
        env:
          ZS_API_KEY: ${{ secrets.ZS_API_KEY }}
        run: |
          printf '%s' "$ZS_API_KEY" | zs login --api-key --token-stdin --profile ci
          # A key of another account would deploy the app somewhere else.
          zs whoami --profile ci | tee whoami.txt
          grep -q "^${ZS_EXPECTED_USER} <" whoami.txt
      - name: Point the manifest at the image of this commit
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          sed -i "s|space-invaders:latest|space-invaders:${TAG}|" zs.yaml
          grep -q "space-invaders:${TAG}" zs.yaml
      # zs exits 0 even when a deployment is marked failed, and today the platform adds failed records after a redeploy
      # that did swap the container (see docs/deploy.md). So what zs prints is shown, and the verdict is the next step's.
      - name: Deploy
        run: zs deploy --profile ci 2>&1 | tee deploy.txt
      - name: Check that the new version is the one answering
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the repository variable APP_URL to the address of the app, so that a deploy can be checked."
            exit 1
          fi
          for attempt in $(seq 1 24); do
            revision="$(curl --silent --fail "${APP_URL}/api/health" | jq -r '.revision // ""' || true)"
            if [ "$revision" = "$GITHUB_SHA" ]; then
              echo "The app runs ${GITHUB_SHA}."
              if grep -q "Deploy failed" deploy.txt; then
                echo "::warning::zs reported a failed deployment, but the new version is serving (known platform quirk, see docs/deploy.md)."
              fi
              exit 0
            fi
            echo "Attempt ${attempt}: the app reports revision '${revision}', waiting for ${GITHUB_SHA}."
            sleep 10
          done
          echo "::error::The app did not come up on ${GITHUB_SHA}. This is what zs deploy printed:"
          cat deploy.txt
          exit 1
