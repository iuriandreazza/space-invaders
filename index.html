<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Invaders — a free browser tribute with aimed lasers and a global leaderboard</title>
    <meta name="description" content="Aim two lasers with your mouse, finger or keyboard, stop the invaders and climb the global leaderboard. A free browser tribute to the arcade classics Space Invaders and Space Invaders Frenzy." />
    <meta name="author" content="Iuri Andreazza" />
    <meta name="theme-color" content="#05060d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Link previews. Crawlers do not run scripts and only follow absolute URLs, so the address of the site is written
      out in the canonical link, og:url and og:image: change all three if the site moves (a test keeps them together).
    -->
    <link rel="canonical" href="https://app-09552e76.apps.zeroserver.cc/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Space Invaders" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://app-09552e76.apps.zeroserver.cc/" />
    <meta property="og:title" content="Space Invaders — a free browser tribute with aimed lasers and a global leaderboard" />
    <meta property="og:description" content="Aim two lasers with your mouse, finger or keyboard, stop the invaders and climb the global leaderboard." />
    <meta property="og:image" content="https://app-09552e76.apps.zeroserver.cc/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two orange lasers from the bottom corners meet on a reticle over rows of pink, blue and green invaders, above four green bunkers." />
    <!-- X reads the og: tags too; it only needs to be told to show the large card, and has its own alt text. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="Two orange lasers from the bottom corners meet on a reticle over rows of pink, blue and green invaders, above four green bunkers." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
