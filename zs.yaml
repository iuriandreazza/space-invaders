# Manifest of the app on the ZeroServer Community Cloud (reference: docs/deploy.md).
# One service, one instance: the platform runs a single instance per app, and the leaderboard is a SQLite file on a
# named volume. The deploy workflow swaps `:latest` for the tag of the commit it deploys.
app: space-invaders

placement:
  country: BR

services:
  - name: web
    image: ghcr.io/iuriandreazza/space-invaders:latest
    env:
      # Two proxies stand in front of the container (the gateway's Caddy and the FRP vhost), each appending to
      # X-Forwarded-For, and the rate limit tells players apart by the address that comes out of that. Measured on this
      # app and on River Raid: with 2 the log shows the real client address, with 1 every player showed up as the
      # gateway's own address. See docs/deploy.md, step 6.
      - TRUST_PROXY=2
    ports:
      - "8080"
    volumes:
      # The leaderboard (SQLite). Persistent and snapshotted by the platform, but pinned to one node and not replicated.
      - leaderboard:/data
    exposed: true
